[package]
name = "nps"
version = "0.2.11"
description = "Find SEARCH_TERM in available nix packages and sort results by relevance"
authors = ["Ole Mussmann <github+account@ole.mn>"]
homepage = "https://github.com/OleMussmann/nps"
repository = "https://github.com/OleMussmann/nps"
documentation = "https://github.com/OleMussmann/nps/blob/main/README.md"
license = "MIT"
readme = "README.md"
edition = "2021"

[dependencies]
clap = { version = "4.5.53", features = ["derive", "env", "string"] }
env_logger = "0.11.8"
grep = "0.4.1"
home = "0.5.12"
log = "0.4.29"
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.23.0"
termcolor = "1.4.1"
terminal_size = "0.4.3"
unicode-segmentation = "1.12.0"
unicode-width = "0.2.2"

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.3"
temp-env = "0.3.6"
