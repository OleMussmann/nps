[package]
name = "nps"
version = "0.2.13"
description = "Find SEARCH_TERM in available nix packages and sort results by relevance"
authors = ["Ole Mussmann <github+account@ole.mn>"]
homepage = "https://github.com/OleMussmann/nps"
repository = "https://github.com/OleMussmann/nps"
documentation = "https://github.com/OleMussmann/nps/blob/main/README.md"
license = "MIT"
readme = "README.md"
edition = "2021"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env", "string"] }
env_logger = "0.11.11"
grep = "0.4.1"
home = "0.5.12"
log = "0.4.34"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
termcolor = "1.4.1"
terminal_size = "0.4.4"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
temp-env = "0.3.6"
